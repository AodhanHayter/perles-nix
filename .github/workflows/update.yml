name: Update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.check.outputs.update }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - id: check
        run: ./scripts/update-version.sh --check >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: perles-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Bump on every runner, then build: nothing is committed before every
      # platform is known to build and smoke-test.
      - run: ./scripts/update-version.sh --version "${{ needs.check.outputs.latest }}" --no-verify
      - run: nix flake check --print-build-logs

  commit:
    needs: [check, update]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./scripts/update-version.sh --version "${{ needs.check.outputs.latest }}" --no-verify
      - name: Commit and tag
        env:
          VERSION: ${{ needs.check.outputs.latest }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "perles $VERSION"
          git tag -f "v$VERSION"
          git tag -f latest
          git push origin HEAD --follow-tags
          git push -f origin "v$VERSION" latest
